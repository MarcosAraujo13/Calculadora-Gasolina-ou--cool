<!DOCTYPE html>
<html lang="pt-br">
    <head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Keywoeds" content="Calculadora alcool ou gasolina">
    <link rel="stylesheet" href="style.css"/>

    <title>Calculadora alcool ou gasolina</title>

</head>

    <body>

        <main class="container">

            <img class="logo" src="./assets/logo.png" alt=" Logo da Calculadora gasolina ou alcool"/>

            <h1 class="title">Qual melhor opção? </h1>

            <form onsubmit="calcular(event)" class="form">

                <label>Álcool (preço por litro) </label>

                <input type="number"
                id="alcool"
                class="input"
                placeholder="4.90"
                min="1"
                step="0.01"
                required

                />

               <label>Gasolina (preço por litro) </label>

                <input type="number"
                id="gasolina"
                class="input"
                placeholder="4.90"
                min="1"
                step="0.01"
                required

                /> 

                <input class="button" type="submit" value="Calcular"/>

            </form>

            <section id="content-result" class="result hide">

                <span id="text-result">Compensa usar Álcool.</span>
                <span id="alcool-result"> Alcool R$ 3.90</span>
                <span id="gasolina-result"> Galina R$ 5.90 </span>

            </section>

            
        </main>
        
        <div class="info">

            <span class="tooltip"> Veja como é feito o calculo</span>

            <a href="calculo.html">
                <!--src caminho da imagem. alt alternativo*/ -->
                <img class="info-img" src = "./assets/info.png" alt="Veja como é feito o calculo" />

            </a>

        </div>

    <script src="script.js"></script>

    </body>

</html>
